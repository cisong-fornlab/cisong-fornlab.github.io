<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文学 · 当前作品 · FORN Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f2430;
    --ink-soft: #4d5566;
    --ink-faint: #8b93a5;
    --accent: #0d9488;
    --serif: 'EB Garamond', 'Noto Serif SC', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 内容区统一 80% 宽，左右各 10% */
  .wrap { width: 80%; margin-left: auto; margin-right: auto; }

  .site-nav {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #e7e9f0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    padding-bottom: 14px;
  }
  .brand {
    display: flex; flex-direction: column; line-height: 1.25; color: var(--ink);
  }
  .brand:hover { text-decoration: none; }
  .brand .brand-en {
    font-family: var(--serif); font-size: 1.15rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent);
  }
  .brand .brand-zh { font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.32em; }
  .back { color: var(--accent); font-size: 0.95rem; letter-spacing: 0.1em; }

  main {
    flex: 1;
    width: 80%;
    margin: 0 auto;
    padding: 60px 0 40px;
    text-align: center;
  }
  .sec-en {
    display: block;
    font-family: var(--serif);
    font-size: 0.8rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--accent);
    margin: 0 0 14px;
  }
  .h1-rule {
    width: 56px; height: 3px; border-radius: 2px;
    background: var(--accent);
    margin: 0 auto 40px;
    opacity: 0.6;
  }
  figure { margin: 0 0 40px; }
  figure img {
    width: 100%;
    max-width: 760px;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 14px 40px rgba(31,36,48,0.14);
  }
  .wip {
    color: var(--ink-soft);
    max-width: 34rem;
    margin: 0 auto;
  }
  .wip .badge {
    display: inline-block;
    padding: 6px 20px;
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 18px;
  }
  footer {
    border-top: 1px solid #e7e9f0;
    padding: 28px 0 38px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.85rem;
  }
  @media (max-width: 640px) {
    .wrap, main { width: 88%; }
    .brand .brand-zh { display: none; }
    main { padding-top: 44px; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-en">FORN Lab</span>
      <span class="brand-zh">关系网络基础原理实验室</span>
    </a>
    <a class="back" href="index.html#works">← 返回当前作品</a>
  </div>
</header>

<main>
  <span class="sec-en">Literature</span>
  <h1>文学</h1>
  <div class="h1-rule"></div>
  <figure>
    <img src="assets/img/literature.png" alt="文学：月相七章，从峨眉月到残月">
  </figure>
  <div class="wip">
    <span class="badge">内容建设中</span>
    <p>本栏目正在整理与撰写中，敬请期待。后续将在此展示 FORN Lab 在「文学」方向的作品与笔记。</p>
  </div>
</main>

<footer>© 2026 FORN Lab · 关系网络基础原理实验室</footer>

</body>
</html>
